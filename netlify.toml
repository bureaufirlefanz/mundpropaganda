# Der Zeiger auf das Verzeichnis, in dem gebaut wird.
#
# Alles Weitere steht in `web/netlify.toml`. Diese Aufteilung ist nicht
# Geschmack, sondern nötig: Der Astro-Netlify-Adapter läuft mit `web/` als
# Arbeitsverzeichnis und löst `netlify.toml` von dort auf. Eine einzelne
# Datei im Stamm mit `base = "web"` ergab dabei `web/web`, und der
# Dev-Server startete nicht mehr.
#
# Netlify liest zuerst diese Datei, wechselt in das Basisverzeichnis und
# liest die dortige `netlify.toml` darüber.

[build]
  base = "web"
